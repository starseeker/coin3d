name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: system-only
            cmake_gl_flags: -DOBOL_USE_SYSTEM_GL=ON -DOBOL_USE_SWRAST=OFF
            unity_build: ON
            examples: OFF
          - name: swrast-only
            cmake_gl_flags: -DOBOL_USE_SWRAST=ON -DOBOL_USE_SYSTEM_GL=OFF
            unity_build: ON
            examples: OFF
          - name: dual-with-examples
            cmake_gl_flags: -DOBOL_USE_SWRAST=ON -DOBOL_USE_SYSTEM_GL=ON
            unity_build: ON
            examples: ON
          - name: non-unity
            cmake_gl_flags: -DOBOL_USE_SYSTEM_GL=ON -DOBOL_USE_SWRAST=OFF
            unity_build: OFF
            examples: OFF
          - name: no-gl-static
            cmake_gl_flags: -DOBOL_USE_SYSTEM_GL=OFF -DOBOL_USE_SWRAST=OFF -DBUILD_SHARED_LIBS=OFF
            unity_build: OFF
            examples: OFF

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            libpng-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxft-dev libxinerama-dev \
            libgl-dev libglu1-mesa-dev \
            libfontconfig-dev libfreetype-dev \
            libfltk1.3-dev \
            mesa-utils xvfb

      - name: Configure
        run: |
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBOL_BUILD_TESTS=ON \
            -DOBOL_BUILD_EXAMPLES=${{ matrix.examples }} \
            -DOBOL_WARNINGS_AS_ERRORS=ON \
            -DOBOL_USE_UNITY_BUILD=${{ matrix.unity_build }} \
            ${{ matrix.cmake_gl_flags }}

      - name: Build
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Report system OpenGL implementation
        if: matrix.name == 'system-only' || matrix.name == 'dual-with-examples' || matrix.name == 'non-unity'
        run: xvfb-run -a glxinfo -B

      - name: Run tests
        run: |
          cd build
          xvfb-run -a ctest --output-on-failure -C Release

      - name: Repeat unit tests in randomized orders
        if: matrix.name == 'no-gl-static'
        run: build/bin/obol_unit_tests --gtest_shuffle --gtest_random_seed=0 --gtest_repeat=3

      - name: Upload render failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-failures-${{ matrix.name }}
          path: |
            build/test-output/**/visual_*_actual.png
            build/test-output/**/visual_*_difference.png
          if-no-files-found: ignore
          retention-days: 14

  address-undefined-sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake libpng-dev libgl-dev libglu1-mesa-dev \
            libx11-dev libxext-dev xvfb

      - name: Configure
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOBOL_BUILD_TESTS=ON \
            -DOBOL_BUILD_EXAMPLES=OFF \
            -DOBOL_ASAN_UBSAN=ON \
            -DOBOL_USE_UNITY_BUILD=OFF \
            -DOBOL_BUILD_STRESS_TESTS=ON \
            -DOBOL_USE_SYSTEM_GL=ON \
            -DOBOL_USE_SWRAST=ON

      - name: Build focused test executables
        run: |
          cmake --build build-sanitized --parallel 2 \
            --target obol_unit_tests obol_integration_tests obol_lifecycle_tests \
                     obol_dynload_tests obol_stress_tests \
                     obol_system_gl_render_tests obol_concurrent_render_tests

      - name: Run focused test executables
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build-sanitized/bin/obol_unit_tests
          build-sanitized/bin/obol_integration_tests
          build-sanitized/bin/obol_lifecycle_tests
          build-sanitized/bin/obol_stress_tests
          build-sanitized/bin/obol_concurrent_render_tests
          render_filter='*nanort*:*NanoRT*:*arb_shader_parameter_ranges*'
          render_filter="${render_filter}:PortableFeatureContracts.IndexedShapesAndMaterialBindingsRender"
          render_filter="${render_filter}:MaterialBindingRenderTest.*:GLBindingVariantTest.*"
          render_filter="${render_filter}:RenderSceneFactories.SceneTextureSurvivesDifferentContextManagers"
          xvfb-run -a build-sanitized/bin/obol_system_gl_render_tests \
            --gtest_filter="${render_filter}"
          ctest --test-dir build-sanitized --output-on-failure \
            -R '^obol_dynload_tests$'

  build-windows:
    name: Windows MSVC
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        shell: pwsh
        run: vcpkg install fltk:x64-windows libpng:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DOBOL_BUILD_TESTS=ON `
            -DOBOL_BUILD_EXAMPLES=OFF `
            -DOBOL_WARNINGS_AS_ERRORS=ON `
            -DOBOL_USE_UNITY_BUILD=OFF `
            -DOBOL_USE_SYSTEM_GL=ON `
            -DOBOL_USE_SWRAST=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  build-clang:
    name: Linux Clang (non-unity)
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake libpng-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOBOL_BUILD_TESTS=ON \
            -DOBOL_BUILD_EXAMPLES=OFF \
            -DOBOL_WARNINGS_AS_ERRORS=ON \
            -DOBOL_USE_UNITY_BUILD=OFF \
            -DOBOL_USE_SYSTEM_GL=OFF \
            -DOBOL_USE_SWRAST=OFF

      - name: Build and test
        run: |
          cmake --build build-clang --parallel 2
          ctest --test-dir build-clang --output-on-failure

  build-macos:
    name: macOS dylib and package smoke
    runs-on: macos-latest
    needs: [build-linux]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install libpng

      - name: Configure
        run: |
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DOBOL_BUILD_TESTS=ON \
            -DOBOL_BUILD_EXAMPLES=OFF \
            -DOBOL_WARNINGS_AS_ERRORS=ON \
            -DOBOL_USE_UNITY_BUILD=OFF \
            -DOBOL_USE_SYSTEM_GL=OFF \
            -DOBOL_USE_SWRAST=OFF

      - name: Build and test
        run: |
          cmake --build build-macos --parallel 2
          ctest --test-dir build-macos --output-on-failure

  thread-sanitizer:
    name: Linux ThreadSanitizer
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: read

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            libpng-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxft-dev libxinerama-dev \
            libgl-dev libglu1-mesa-dev \
            libfontconfig-dev libfreetype-dev \
            libfltk1.3-dev

      - name: Configure
        run: |
          cmake -S . -B build-tsan \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DOBOL_BUILD_TESTS=ON \
            -DOBOL_BUILD_EXAMPLES=OFF \
            -DOBOL_TSAN=ON \
            -DOBOL_USE_UNITY_BUILD=OFF \
            -DOBOL_BUILD_STRESS_TESTS=ON \
            -DOBOL_USE_SYSTEM_GL=OFF \
            -DOBOL_USE_SWRAST=ON

      - name: Build focused thread tests
        run: |
          cmake --build build-tsan --config RelWithDebInfo --parallel 2 \
            --target obol_unit_tests obol_integration_tests obol_stress_tests \
                     obol_dynload_tests obol_concurrent_render_tests

      - name: Run focused thread tests
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          setarch "$(uname -m)" -R build-tsan/bin/obol_unit_tests \
            --gtest_filter='ThreadPrimitives.*:GlobalThreadSafety.*:Sensors.ConcurrentQueueProcessors*:Sensors.DelayTimeoutConfiguration*:Engines.ConcurrentCalculatorParser*:ImageFormatRegistry.*:ErrorHandling.*:ProfilerSuite.*:ActionExceptionSafety.*:SbImageThreadSafety.*:IoSodb.*'
          setarch "$(uname -m)" -R build-tsan/bin/obol_integration_tests \
            --gtest_filter='CadInstanceRecords.*'
          setarch "$(uname -m)" -R build-tsan/bin/obol_stress_tests \
            --gtest_filter='ThreadSafetyStress.*'
          setarch "$(uname -m)" -R ctest --test-dir build-tsan \
            --output-on-failure -R '^obol_dynload_tests$'
          setarch "$(uname -m)" -R build-tsan/bin/obol_concurrent_render_tests
